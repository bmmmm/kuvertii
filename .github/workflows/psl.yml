name: psl

# Refreshes js/psl.js from publicsuffix.org once a month — see the header
# comment in tools/build-psl.mjs for why the list is committed rather than
# fetched at runtime. Scheduled separately from pages.yml's daily 04:17 UTC
# cron so the two never collide.
on:
  schedule:
    - cron: '13 5 1 * *'
  workflow_dispatch:

# Read-only by default; only the job that may push gets `contents: write`.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node tools/build-psl.mjs

      # A refreshed list that breaks a test must never land unattended.
      - run: node --test

      - name: Commit and push if the list changed
        run: |
          if git diff --quiet -- js/psl.js; then
            echo "js/psl.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/psl.js
          git commit -m "chore: refresh the public suffix list"
          # A push made with the default GITHUB_TOKEN does not trigger other
          # workflows, so this does not kick off pages.yml — the refreshed
          # list reaches the live site with the next daily 04:17 UTC run
          # rather than immediately. Acceptable: the list is already
          # committed and correct, just not yet deployed.
          git push
