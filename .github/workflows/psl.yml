name: psl

# Refreshes js/psl.js from publicsuffix.org once a month — see the header
# comment in tools/build-psl.mjs for why the list is committed rather than
# fetched at runtime. Scheduled separately from pages.yml's daily 04:17 UTC
# cron so the two never collide.
on:
  schedule:
    - cron: '13 5 1 * *'
  workflow_dispatch:

# Read-only by default; the one job that commits gets `contents: write`.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node tools/build-psl.mjs

      # A refreshed list that breaks a test must never land unattended.
      - run: node --test

      # Straight onto main. There is nothing to review: the file is generated
      # from publicsuffix.org by a script whose output nobody reads line by
      # line, and the step above is the actual gate — a refreshed list that
      # breaks a test never gets here.
      #
      # The one consequence, worth knowing rather than avoiding: this commit is
      # born on GitHub, and main here is the mirror of the Forgejo origin. So
      # for one month of the year the mirror is ahead of the source, and the
      # next local session pulls it back the other way before pushing:
      #
      #   git pull --rebase github main   # then push origin, then github
      #
      # A push made with the default GITHUB_TOKEN triggers no other workflow,
      # so pages.yml does not run for it — the refreshed list reaches the live
      # site with the next daily 04:17 UTC build rather than immediately.
      - name: Commit and push if the list changed
        run: |
          if git diff --quiet -- js/psl.js; then
            echo "js/psl.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/psl.js
          git commit -m "chore: refresh the public suffix list"
          git push
